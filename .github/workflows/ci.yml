name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The model is a quantile ML ensemble; the UI must never call it AI, an LLM or an assistant.
      - name: Check UI wording
        run: "! grep -rnE '\\bAI\\b|\\b[Ll][Ll][Mm]s?\\b|[Cc]opilot|[Cc]hatbot|\\bGPT\\b|[Aa]rtificial intelligence|[Aa]ssistant' src"
      # Route types (LayoutProps etc.) live in .next/types, which a clean checkout lacks.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      # Static export served on Vercel (reads the committed public/demo/*.json).
      - run: npm run build:demo
      - name: Check static export
        run: |
          for page in index forecast/index what-if/index backtest/index data/index how-it-works/index; do test -f "out/$page.html"; done
          test -f out/demo/manifest.json && test -f out/demo/explain.json

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
